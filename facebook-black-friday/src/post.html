<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IN;src:url(file:///usr/share/fonts/opentype/inter/Inter-Medium.otf);font-weight:500}
@font-face{font-family:IN;src:url(file:///usr/share/fonts/opentype/inter/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:IN;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-Bold.otf);font-weight:700}
@font-face{font-family:IN;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf);font-weight:800}
@font-face{font-family:IN;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf);font-weight:900}
:root{--bg:#0c0c0c;--ink:#f3f1ec;--mute:#8d8a84;--line:#2a2a2a;--g:#3fa33e;--g2:#57b947}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:IN,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink);background:var(--bg);overflow:hidden;position:relative}
.abs{position:absolute}
.meta{font-weight:600;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.k{font-weight:900;letter-spacing:-.045em;line-height:.9;text-transform:uppercase}
.rule{height:1px;background:var(--line)}
.browser{position:absolute;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5);border:1px solid #333}
.browser .bar{height:32px;background:#1b1b1b;display:flex;align-items:center;gap:8px;padding:0 14px}
.browser .bar i{width:10px;height:10px;border-radius:50%;background:#3a3a3a;display:inline-block}
.browser .bar span{margin-left:12px;font-size:14px;color:#9a9a9a;font-weight:500}
.browser img{display:block;width:100%}
.phone{position:absolute;border-radius:40px;background:#111;padding:9px;box-shadow:0 30px 60px rgba(0,0,0,.55);border:1px solid #333}
.phone .scr{position:relative;width:100%;height:100%;border-radius:32px;overflow:hidden;background:#fff}
.phone .scr img{position:absolute;top:0;left:0;width:100%}
.phone .isl{position:absolute;top:14px;left:50%;width:76px;height:22px;margin-left:-38px;background:#000;border-radius:12px;z-index:3}
.btn{display:inline-flex;align-items:center;gap:16px;background:var(--ink);color:#0c0c0c;font-weight:700;border-radius:10px}
.tag{display:inline-block;background:var(--g);color:#06120a;font-weight:800;border-radius:6px}
#tick{position:absolute;z-index:30;left:0;right:0;bottom:0;background:var(--g);color:#06120a;white-space:nowrap;overflow:hidden;font-weight:900;letter-spacing:.06em}
</style></head><body>
<div id="root"></div>
<script>
const Q=new URLSearchParams(location.search);const W=+Q.get('w'),H=+Q.get('h');document.body.style.width=W+'px';document.body.style.height=H+'px';
const SQ=W===H,TALL=H>1600;
const r=document.getElementById('root');
const tickH=SQ?50:TALL?64:56;
const L=SQ?{hd:62,rule:130,meta:160,hl:130,hlTop:192,blkTop:446,blkH:150,blkW:640,pct:128,subTop:620,sub:40,ctaTop:860,cta:32,dev:'sq'}
 :TALL?{hd:74,rule:150,meta:300,hl:210,hlTop:340,blkTop:752,blkH:230,blkW:960,pct:200,subTop:1012,sub:54,ctaTop:1100,cta:36,devTop:1250}
 :{hd:74,rule:150,meta:184,hl:150,hlTop:218,blkTop:516,blkH:164,blkW:960,pct:146,subTop:706,sub:46,ctaTop:700,cta:30,devTop:830};
let h=`<div class="abs" style="left:60px;right:60px;top:${SQ?44:52}px;display:flex;justify-content:space-between;align-items:center"><img src="../assets/logo_white.png" style="height:${L.hd}px"><span class="meta" style="color:#bdbab3">afaipixel.com</span></div>
<div class="abs rule" style="left:60px;right:60px;top:${L.rule}px"></div>
<div class="abs meta" style="left:60px;top:${L.meta}px">Black Friday · Limited-time offer</div>
<div class="abs k" style="left:56px;top:${L.hlTop}px;font-size:${L.hl}px">Black<br>Friday</div>
<div class="abs" style="left:60px;top:${L.blkTop}px;width:${L.blkW}px;height:${L.blkH}px;background:var(--g);border-radius:8px"><div class="abs k" style="left:28px;top:${(L.blkH-L.pct*0.9)/2+3}px;font-size:${L.pct}px;color:#06120a;white-space:nowrap">20% off</div></div>
<div class="abs" style="left:60px;top:${L.subTop}px;font-weight:700;font-size:${L.sub}px;letter-spacing:-.02em">every new website.</div>`;
const btn=`<span class="btn" style="font-size:${L.cta}px;padding:${Math.round(L.cta*0.62)}px ${Math.round(L.cta*0.95)}px">Send us a message →</span>`;
if(SQ){
 h+=`<div class="phone" style="left:732px;top:168px;width:280px;height:258px;border-bottom-left-radius:0;border-bottom-right-radius:0;display:none"></div>`;
 h+=`<div class="phone" style="left:740px;top:170px;width:270px;height:560px"><div class="isl"></div><div class="scr"><img src="../rec_case/0000.jpg"></div></div>`;
 h+=`<div class="abs meta" style="left:60px;top:700px;font-size:20px">Starter · Business · E-commerce websites</div>`;
 h+=`<div class="abs rule" style="left:60px;right:60px;top:${L.ctaTop-40}px"></div>`;
 h+=`<div class="abs" style="left:60px;right:60px;top:${L.ctaTop}px;display:flex;justify-content:space-between;align-items:center">${btn}<div style="text-align:right;font-weight:700;font-size:26px;line-height:1.4">WhatsApp<br><span style="font-weight:600;color:#c9c6bf;font-size:24px">+94 757 323 323</span></div></div>`;
}else{
 const ct=TALL?L.ctaTop:L.ctaTop;
 if(TALL){h+=`<div class="abs" style="left:60px;right:60px;top:${ct}px;display:flex;justify-content:space-between;align-items:center">${btn}<div class="meta" style="font-size:18px;text-align:right;line-height:1.6">Starter · Business<br>E-commerce</div></div>`}
 else{h+=`<div class="abs" style="right:60px;top:${ct-6}px">${btn}</div><div class="abs meta" style="left:60px;top:${L.subTop+62}px;font-size:18px">Starter · Business · E-commerce</div>`}
 const bw=TALL?780:720;
 h+=`<div class="browser" style="left:60px;top:${L.devTop+(TALL?110:80)}px;width:${bw}px"><div class="bar"><i></i><i></i><i></i><span>windoors.lk</span></div><img src="../clients/wd_d.jpg"></div>`;
 h+=`<div class="phone" style="left:${TALL?730:700}px;top:${L.devTop}px;width:${TALL?300:290}px;height:${TALL?640:600}px"><div class="isl"></div><div class="scr"><img src="../rec_case/0000.jpg"></div></div>`;
}
h+=`<div id="tick" style="height:${tickH}px;line-height:${tickH}px;font-size:${SQ?22:TALL?28:24}px">${'&nbsp;BLACK FRIDAY&nbsp;&nbsp;·&nbsp;&nbsp;20% OFF WEBSITES&nbsp;&nbsp;·&nbsp;&nbsp;AFAIPIXEL.COM&nbsp;&nbsp;·'.repeat(6)}</div>`;
r.innerHTML=h;
</script></body></html>
