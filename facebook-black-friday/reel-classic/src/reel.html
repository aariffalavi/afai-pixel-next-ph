<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IN;src:url(file:///usr/share/fonts/opentype/inter/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:IN;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-Bold.otf);font-weight:700}
@font-face{font-family:IN;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf);font-weight:800}
@font-face{font-family:IN;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf);font-weight:900}
:root{--bg:#0b0b0b;--ink:#f4f2ed;--mute:#8d8a84;--g:#46b03f;--gd:#06120a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#000}
body{font-family:IN,'Noto Color Emoji',sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#stage{position:relative;overflow:hidden;background:var(--bg)}
#cam{position:absolute;inset:0}
.abs{position:absolute}.c{left:0;right:0;text-align:center}
.scene{position:absolute;inset:0;display:none}
.k{font-weight:900;letter-spacing:-.05em;line-height:.86;text-transform:uppercase}
.meta{font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.br{position:absolute;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18)}
.br .bar{height:30px;background:#1b1b1b;display:flex;align-items:center;gap:6px;padding:0 10px}
.br .bar i{width:8px;height:8px;border-radius:50%;background:#444;display:inline-block}
.br .bar span{margin-left:8px;font-size:13px;color:#a9a9a9;font-weight:600}
.br img{display:block;width:100%}
.chipX{display:inline-flex;align-items:center;gap:22px;background:#161616;border:2px solid #2a2a2a;border-radius:20px;font-weight:900;letter-spacing:-.03em;text-transform:uppercase}
.chipX b{display:grid;place-items:center;background:var(--g);color:var(--gd);border-radius:12px}
.lt{position:absolute;background:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.lt img{max-width:84%;max-height:70%}
#top{position:absolute;left:56px;right:56px;top:48px;display:flex;justify-content:space-between;align-items:center;z-index:30}
#badge{font-weight:900;font-size:23px;letter-spacing:.12em;padding:9px 14px;border-radius:6px;border:2px solid currentColor}
#ticker{position:absolute;left:0;right:0;bottom:0;overflow:hidden;white-space:nowrap;font-weight:900;letter-spacing:.06em;z-index:30}
#flash{position:absolute;inset:0;background:#fff;z-index:40;pointer-events:none;opacity:0}
</style></head>
<body><div id="stage"><div id="cam">
<div id="gbg" class="abs" style="inset:0;background:var(--g);opacity:0"></div>
<div id="top"><img id="logoW" src="../assets/logo_white.png" style="height:70px"><span id="badge">LIMITED TIME</span></div>

<div class="scene" id="hook"><div class="abs c" id="hk"><div style="font-size:150px;line-height:1">✋</div><div class="k" id="hkT" style="font-size:210px;margin-top:20px">Stop<br>scrolling</div></div></div>
<div class="scene" id="bf"><div class="abs" id="bfC" style="left:52px;right:52px"><div id="bfIts" style="font-weight:800;font-size:70px;text-transform:uppercase;letter-spacing:-.02em;margin-bottom:22px">It's</div><div class="k" id="bfB" style="font-size:260px">Black</div><div class="k" id="bfF" style="font-size:260px">Friday</div></div></div>
<div class="scene" id="pct"><div class="abs c" id="pC"><div class="k" id="p20" style="font-size:470px;color:var(--gd);line-height:.8">20%</div><div class="k" id="pOff" style="font-size:280px;color:var(--gd)">OFF</div><div id="pEv" style="display:inline-block;margin-top:40px;background:var(--gd);color:var(--ink);font-weight:900;font-size:66px;letter-spacing:-.02em;padding:18px 34px;border-radius:10px;text-transform:uppercase">Every new website</div></div></div>
<div class="scene" id="feat"><div id="fan"></div><div class="abs" id="fC" style="left:56px;right:56px"></div></div>
<div class="scene" id="trust"><div class="abs" id="tT" style="left:56px;right:56px"><div class="k" style="font-size:120px">Trusted by<br><span style="color:var(--g)">brands</span><br>worldwide</div></div><div id="tG"></div></div>
<div class="scene" id="cta">
  <div class="abs c" id="dmo"><div class="k" style="font-size:220px">Don't<br>miss<br><span style="color:var(--g)">out!</span></div></div>
  <img id="poster" class="abs" style="left:0;top:0;width:100%;opacity:0">
  <div id="ring" class="abs" style="border:6px solid #f4f2ed;border-radius:18px;opacity:0;z-index:5"></div>
  <div id="tap" class="abs" style="font-size:120px;opacity:0;z-index:6">👆</div>
</div>
<div id="ticker"><span id="tk"></span></div>
</div><div id="flash"></div></div>
<script>
const Q=new URLSearchParams(location.search);const W=+(Q.get('w')||1080),H=+(Q.get('h')||1920);const TALL=H>1600;
document.body.style.width=W+'px';document.body.style.height=H+'px';const ST=document.getElementById('stage');ST.style.width=W+'px';ST.style.height=H+'px';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));const P=(t,a,b)=>clamp((t-a)/(b-a));
const oQ=x=>1-Math.pow(1-x,5),oC=x=>1-Math.pow(1-x,3);
const $=id=>document.getElementById(id);let TL,BEAT,BTN;const IMP=[];
function fw(l,txt,n=1){let c=0;for(const w of TL.caps.filter(c=>c.line===l)){if(w.w.toLowerCase().replace(/[^a-z0-9]/g,'').startsWith(txt)){c++;if(c===n)return w.s}}console.warn('nf',l,txt);return 0}
function slam(e,t,t0,from=1.5){const k=P(t,t0-0.04,t0+0.15);e.style.opacity=k>0?1:0;e.style.transform=`scale(${from-(from-1)*oQ(k)})`;return k}
function sc(id){return TL.scenes.find(x=>x.id===id)}
function init(tl,btn){TL=tl;BEAT=60/tl.bpm;BTN=btn[TALL?'story-9x16':'feed-4x5'];
  $('tk').innerHTML=Array(16).fill('<span class="tu" style="display:inline-block;padding-right:40px">BLACK FRIDAY&nbsp;&nbsp;·&nbsp;&nbsp;20% OFF WEBSITES&nbsp;&nbsp;·&nbsp;&nbsp;MESSAGE US&nbsp;&nbsp;·</span>').join('');$('tk').style.display='inline-block';
  const th=TALL?68:58;$('ticker').style.height=th+'px';$('ticker').style.lineHeight=th+'px';$('ticker').style.fontSize=(TALL?28:24)+'px';
  $('poster').src=TALL?'classic_story-9x16.png':'classic_feed-4x5.png';
  $('hk').style.top=(TALL?560:300)+'px';$('hkT').style.fontSize=(TALL?180:170)+'px';
  $('bfC').style.top=(TALL?600:330)+'px';if(!TALL){$('bfB').style.fontSize=$('bfF').style.fontSize='230px'}
  $('pC').style.top=(TALL?470:200)+'px';if(!TALL){$('p20').style.fontSize='440px';$('pOff').style.fontSize='240px';$('pEv').style.fontSize='56px'}
  // fan of real client sites
  const sites=[['../bf3/shots/ss_d.jpg','surfacestone.co.uk'],['../bf3/shots/tf_d.jpg','transfoodgrosshandel.com'],['../bf3/shots/ks_d.jpg','kingstonesurface.co.uk']];const dw=TALL?480:440,dh=dw*0.625;const fy=TALL?1180:820;
  [[-1,-6,0],[1,6,2],[0,0,1]].forEach(([pos,rot,i])=>{const d=document.createElement('div');d.className='br';d.id='fb'+i;d.dataset.rot=rot;d.style.cssText=`left:${W/2-dw/2+pos*dw*0.55}px;top:${fy+(pos?dh*0.1:0)}px;width:${dw}px;z-index:${pos?1:2}`;d.innerHTML=`<div class="bar"><i></i><i></i><i></i><span>${sites[i][1]}</span></div><img src="${sites[i][0]}">`;$('fan').appendChild(d)});
  $('fC').style.top=(TALL?330:200)+'px';
  [['Custom design','custom'],['Mobile ready','mobile'],['SEO ready','s']].forEach(([s,w],i)=>{const d=document.createElement('div');d.id='fc'+i;d.dataset.w=w;d.style.cssText=`margin-bottom:${TALL?28:20}px;opacity:0`;const fs=TALL?78:66;d.innerHTML=`<span class="chipX" style="font-size:${fs}px;padding:${fs*0.28}px ${fs*0.4}px"><b style="width:${fs*1.1}px;height:${fs*1.1}px;font-size:${fs*0.7}px">✓</b>${s}</span>`;$('fC').appendChild(d)});
  $('tT').style.top=(TALL?330:200)+'px';
  const lg=['../bf3/logos/kingstone.png','../bf3/logos/surfacestone.png','../bf3/logos/agl.png','../bf3/logos/smeraldo.png','../bf3/logos/primepark.png'];const tw=TALL?300:300,th2=tw*0.62,gx=24,gy=24,ty=TALL?820:640;
  lg.forEach((f,i)=>{const row=i<3?0:1,col=i<3?i:i-3;const rw=row?2:3;const x0=(W-(rw*tw+(rw-1)*gx))/2;const d=document.createElement('div');d.className='lt';d.id='tl'+i;d.style.cssText=`left:${x0+col*(tw+gx)}px;top:${ty+row*(th2+gy)}px;width:${tw}px;height:${th2}px;opacity:0`;d.innerHTML=`<img src="${f}">`;$('tG').appendChild(d)});
  $('dmo').style.top=(TALL?560:250)+'px';if(!TALL)$('dmo').querySelector('.k').style.fontSize='190px';
  IMP.push(fw(0,'stop'),fw(1,'black'),fw(1,'friday'),fw(2,'twenty'),fw(6,'dont'),fw(7,'message'));
}
async function render(t){
  let sh=0;for(const ti of IMP){const d=t-ti;if(d>=0&&d<0.22)sh=Math.max(sh,1-d/0.22)}
  const ph=(t%BEAT)/BEAT;const pulse=1+0.014*Math.exp(-ph*6);
  $('cam').style.transform=`translate(${Math.sin(t*93)*11*sh}px,${Math.cos(t*79)*11*sh}px)`;
  let fl=0;for(const ti of [fw(2,'twenty'),fw(7,'message')]){const d=t-ti;if(d>=0&&d<0.12)fl=Math.max(fl,0.6*(1-d/0.12))}$('flash').style.opacity=fl;
  const H0=sc('hook'),Pp=sc('pct');
  // hook strobes green/black on every beat
  const hookGreen=t<H0.e&&Math.floor(t/BEAT)%2===1;
  const green=hookGreen||(t>=Pp.s&&t<Pp.e);
  $('gbg').style.opacity=green?1:0;$('logoW').style.filter=green?'brightness(0)':'none';$('badge').style.color=green?'#06120a':'#f4f2ed';
  $('ticker').style.background=green?'#06120a':'#46b03f';$('ticker').style.color=green?'#46b03f':'#06120a';
  const uw=document.querySelector('.tu').offsetWidth;$('tk').style.transform=`translateX(${-((t*120)%uw)}px)`;
  for(const s of TL.scenes){const e=$(s.id);const on=t>=s.s&&t<s.e;e.style.display=on?'block':'none';if(!on)continue;const u=t-s.s;
  if(s.id==='hook'){$('hkT').style.color=hookGreen?'#06120a':'#f4f2ed';slam($('hk'),t,-0.2,1.35);$('hk').style.transform+=` scale(${pulse})`}
  if(s.id==='bf'){const ki=P(t,fw(1,'its')-0.05,fw(1,'its')+0.2);$('bfIts').style.opacity=ki;[['bfB','black'],['bfF','friday']].forEach(([id,w])=>{const e=$(id);const k=slam(e,t,fw(1,w));e.style.opacity=1;if(k<=0){e.style.color='transparent';e.style.webkitTextStroke='3px rgba(244,242,237,.55)';e.style.transform='scale(1)'}else{e.style.color='#f4f2ed';e.style.webkitTextStroke='0'}});$('bfC').style.transform=`scale(${pulse})`}
  if(s.id==='pct'){slam($('p20'),t,Math.min(fw(2,'twenty'),s.s+0.06),1.8);slam($('pOff'),t,fw(2,'off'),1.6);const ke=P(t,fw(3,'every')-0.05,fw(3,'every')+0.22);$('pEv').style.opacity=ke>0?1:0;$('pEv').style.clipPath=`inset(0 ${(1-oQ(ke))*100}% 0 0)`;$('pC').style.transform=`scale(${pulse})`}
  if(s.id==='feat'){for(let i=0;i<3;i++){const b=$('fb'+i);const k=oQ(P(u,0.05+i*0.12,0.5+i*0.12));b.style.opacity=k;b.style.transform=`translateY(${(1-k)*200}px) rotate(${b.dataset.rot}deg)`}
    for(let i=0;i<3;i++){const d=$('fc'+i);const ti=fw(4,d.dataset.w);const k=P(t,ti-0.04,ti+0.15);d.style.opacity=k>0?1:0;d.style.transform=`translateX(${(1-oQ(k))*-140}px) scale(${1.25-0.25*oQ(k)})`;d.style.transformOrigin='0 50%'}}
  if(s.id==='trust'){const k=oQ(P(u,0,0.3));$('tT').style.opacity=k;$('tT').style.transform=`translateY(${(1-k)*50}px)`;for(let i=0;i<5;i++){const e=$('tl'+i);const kk=P(u,0.3+i*0.12,0.48+i*0.12);e.style.opacity=kk>0?1:0;e.style.transform=`scale(${1.5-0.5*oQ(kk)})`}}
  if(s.id==='cta'){const tm=fw(7,'message');const dm=$('dmo');const pre=t<tm-0.03;dm.style.display=pre?'block':'none';if(pre){slam(dm,t,Math.min(fw(6,'dont'),s.s+0.05),1.4);dm.style.transform+=` scale(${pulse})`}
    const po=$('poster');const kp=oQ(P(t,tm-0.03,tm+0.3));po.style.opacity=pre?0:1;po.style.transform=`scale(${1.12-0.12*kp})`;po.style.transformOrigin='50% 40%';
    // hide our header/ticker when poster is up (poster has its own)
    $('top').style.opacity=pre?1:0;$('ticker').style.opacity=pre?1:0;
    const [bx,by,bw,bh]=BTN;const tc=fw(7,'claim');const ring=$('ring');const kr=((t-tc)%0.9)/0.9;if(t>tc){ring.style.opacity=(1-kr)*0.9;ring.style.left=(bx-10-kr*26)+'px';ring.style.top=(by-10-kr*26)+'px';ring.style.width=(bw+20+kr*52)+'px';ring.style.height=(bh+20+kr*52)+'px'}else ring.style.opacity=0;
    const tp=$('tap');const kt=P(t,tc-0.2,tc+0.25);tp.style.opacity=kt>0?1:0;const press=t>tc+0.25?Math.abs(Math.sin((t-tc)*4))*12:0;tp.style.left=(bx+bw*0.62)+'px';tp.style.top=(by+bh*0.35+(1-oQ(kt))*260+press)+'px'}
  else{$('top').style.opacity=1;$('ticker').style.opacity=1}
  }
  await Promise.all([...document.images].filter(i=>!i.complete).map(i=>i.decode().catch(()=>{})));return true}
</script></body></html>
