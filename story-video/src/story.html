<script>
const FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const oC=x=>1-Math.pow(1-x,3);const oQ=x=>1-Math.pow(1-x,5);const iO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const oB=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const $=id=>document.getElementById(id);
let TL,S={};
function fw(l,txt,n=1){let c=0;for(const w of TL.caps.filter(c=>c.line===l)){if(w.w.toLowerCase().replace(/[^a-z0-9]/g,'').startsWith(txt)){c++;if(c===n)return w.s}}return null}
function lineSpan(l){const w=TL.caps.filter(c=>c.line===l);return [w[0].s,w[w.length-1].e]}
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,k){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`}
// sky palettes [top,bottom]
const SKY={night:['#060a18','#1b2240'],predawn:['#1a2346','#c9776a'],day:['#6fb2e6','#f3d9b0'],grey:['#3c434c','#6c737a'],dusk:['#1d1a3a','#f08a5a'],gold:['#f7b267','#fde4b8']};
function skyAt(t){
  const s=id=>TL.scenes.find(x=>x.id===id);
  const keys=[[0,'night'],[s('dawn').e-1,'predawn'],[s('heart').s,'predawn'],[s('past').s+0.6,'grey'],[s('seen').s+0.3,'night'],[s('oneday').s,'predawn'],[s('first').s+2.5,'gold'],[s('why').s-0.4,'gold'],[s('why').s+0.8,'dusk'],[s('trust').s,'dusk'],[s('cta').s,'gold'],[999,'gold']];
  for(let i=0;i<keys.length-1;i++){const [a,na]=keys[i],[b,nb]=keys[i+1];if(t<=b){const k=iO(P(t,a,b));return [mix(SKY[na][0],SKY[nb][0],k),mix(SKY[na][1],SKY[nb][1],k)]}}
  return SKY.gold;
}
function init(tl){
  TL=tl;
  const r=rnd(5);let st='';for(let i=0;i<120;i++)st+=`<circle cx="${r()*1080}" cy="${r()*1000}" r="${0.8+r()*2}" fill="#fff" opacity="${0.3+r()*0.7}"/>`;$('stars').innerHTML=st;

  let c='';const rc=rnd(9);S.wins=[];
  for(let layer=0;layer<2;layer++){let x=0;while(x<1600){const w=90+rc()*130,h=(layer?380:520)+rc()*(layer?260:360);const y=(layer?1180:1120)-h;const col=layer?'#1a1f2b':'#121520';c+=`<rect x="${x}" y="${y}" width="${w}" height="${h+500}" fill="${col}"/>`;

  $('city').innerHTML=c;

  let b='';for(let i=0;i<8;i++)b+=`<circle id="bb${i}" cx="${270+i*77}" cy="840" r="7" fill="#ffe2a0"/>`;$('bulbs').innerHTML=b;
  // goods on shelves
  const rg=rnd(3);let g='';const cols=['#f4c9a8','#e8a87c','#c38d5e','#f6e1b5','#e9b1b1','#b8d8a8'];
  for(const y of [1200,1290,1370])for(let x=250;x<620;x+=44){const h=26+rg()*36;const cc=cols[Math.floor(rg()*cols.length)];g+=rg()>.5?`<rect x="${x}" y="${y-h}" width="34" height="${h}" rx="8" fill="${cc}"/>`:`<ellipse cx="${x+17}" cy="${y-14}" rx="18" ry="14" fill="${cc}"/>`}

  hg+=`<path id="heartp" d="M435 1330 C 290 1235, 340 1150, 435 1200 C 530 1150, 580 1235, 435 1330Z" fill="rgba(255,120,120,.0)" style="filter:drop-shadow(0 0 18px rgba(255,120,120,.9))"/>`;$('heartg').innerHTML=hg;

}
