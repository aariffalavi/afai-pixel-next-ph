<!DOCTYPE html>

:root{--g1:#8be06a;--g2:#3fa33e;--g3:#168f45;--gold:#d9b872}

.abs{position:absolute}
.scene{position:absolute;inset:0;display:none}
.gr{background:linear-gradient(100deg,#c4f5a0,#62c847 45%,#1a9a4b);-webkit-background-clip:text;background-clip:text;color:transparent}
.gold{color:var(--gold)}
.kick{font-weight:900;letter-spacing:-.02em;text-transform:uppercase;line-height:1.02}
.thin{font-weight:300;letter-spacing:-.02em}
.eb{font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.line{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.w{display:inline-block;will-change:transform,filter}
/* devices */
.laptop{position:absolute}
.laptop .lid{position:relative;border-radius:22px;background:#0d1012;padding:14px;box-shadow:0 0 0 2px #2a3034,0 50px 120px rgba(0,0,0,.7)}
.laptop .scr{position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;background:#0a0d10}
.laptop .scr img{width:100%;display:block}
.laptop .base{position:relative;height:22px;margin:0 -7%;background:linear-gradient(#cfd4d8,#8d9398);border-radius:0 0 30px 30px;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.laptop .base:after{content:'';position:absolute;left:42%;right:42%;top:0;height:8px;background:#7c8287;border-radius:0 0 10px 10px}
.phone{position:absolute;border-radius:54px;background:#0b0d0e;padding:12px;box-shadow:0 0 0 2px #2c3236,0 50px 120px rgba(0,0,0,.75)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#000}
.phone .isl{position:absolute;top:22px;left:50%;width:30%;height:26px;margin-left:-15%;background:#000;border-radius:16px;z-index:5}
.phone .scr img{width:100%;display:block;position:absolute;top:0;left:0}
.card{position:absolute;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.65)}
.card .bar{height:30px;background:#eef0f2;display:flex;align-items:center;gap:7px;padding:0 12px}
.card .bar i{width:10px;height:10px;border-radius:50%;display:inline-block}
.card .bar span{margin-left:8px;flex:1;height:18px;border-radius:9px;background:#fff;font-size:12px;font-weight:600;color:#333;display:flex;align-items:center;padding:0 8px}
.card img{width:100%;display:block}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);border-radius:24px}
.tile{position:absolute;border-radius:24px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.tile img{width:86%;height:86%;object-fit:contain}
.svc{display:flex;align-items:center;gap:20px;font-weight:700;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.svc .n{font-weight:600;color:var(--gold);letter-spacing:.1em;width:56px}
#cap{position:absolute;left:0;right:0;text-align:center;font-weight:500;color:rgba(255,255,255,.82);z-index:70;text-shadow:0 2px 16px rgba(0,0,0,.9)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.7) 100%);z-index:60;pointer-events:none}
#grain{position:absolute;inset:-60px;background:url(../r3/noise.png);opacity:.06;mix-blend-mode:overlay;z-index:61;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;z-index:80;pointer-events:none}
</style></head>
